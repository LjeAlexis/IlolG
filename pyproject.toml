[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ilolg"                # recommande en lowercase
version = "0.2.0"
description = "Discord Bot for LoL"
authors = [{ name = "LjeAlexis", email = "alexislajugiepro@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "discord.py>=2.3,<3",
  "python-dotenv>=0.21,<2",
  "requests>=2.28,<3",
  "apscheduler>=3.10,<4",
  "pydantic>=2.7,<3",        # ✅ corrige ici
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ilolg*"]


[project.urls]
Homepage = "https://github.com/LjeAlexis"
Source = "https://github.com/LjeAlexis/IlolG"



[project.scripts]
ilolg = "ilolg.bot:main"
